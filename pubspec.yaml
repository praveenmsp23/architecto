version: 1.0.0
name: architecto
description: "Architecto is a mobile app designed to manage labor attendance, track site stock, and maintain essential details for construction projects."

environment:
  sdk: '>=3.5.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8
  lottie: ^3.1.2
  animate_do: ^3.3.4
  google_fonts: ^6.2.1
  
  # State Management
  provider: ^6.1.2
  get: ^4.6.6
  
  # Firebase Services
  firebase_core: ^3.4.1
  firebase_auth: ^5.2.1
  cloud_firestore: ^5.4.2
  
  # Storage and Utilities
  get_storage: ^2.1.1
  convert: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/lottie/
